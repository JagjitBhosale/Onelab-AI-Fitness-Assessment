name: CI & Deployment Health Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          cd backend
          python -m pytest tests/ -v

  test-frontend:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://onelab-ai-fitness-assessment-tfyi.vercel.app' }}

  health-check:
    name: Production Backend Health Check
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check Backend Health
        run: |
          echo "Pinging backend health endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://onelab-ai-fitness-assessment-tfyi.vercel.app/health)
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Backend is healthy (HTTP $STATUS)"
          else
            echo "❌ Backend health check failed with HTTP $STATUS"
            exit 1
          fi
